name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional pre-computed tag (set by the sync workflow for automatic releases). Leave empty for v<VERSION_NAME>.
        type: string
        required: false
        default: ''
      publish:
        description: Publish the release v<VERSION_NAME> at this commit (otherwise the APKs are only uploaded as a workflow artifact)
        type: boolean
        default: true
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    name: Build and publish a release
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A tag handed over by the sync workflow triggers an automatic release and
      # never reuses the "tag already exists" guard. A manual dispatch builds from
      # nb4a.properties and refuses to overwrite an existing tag.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          test -n "$VERSION_NAME"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            PUBLISH="true"
          else
            TAG="v$VERSION_NAME"
            PUBLISH="${{ inputs.publish }}"
            if [ "$PUBLISH" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "::error::$TAG already exists: raise VERSION_NAME in nb4a.properties for a new release"
              exit 1
            fi
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: stable
          build-number: '999'
          sign: 'true'
      - name: Release assets
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist stable
      - name: Upload artifact
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Throne-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The sync workflow records the synced commit list in the annotated tag
          # message; fall back to recent history for manual releases.
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/commits.txt" 2>/dev/null || true
          bash buildScript/auto_release_notes.sh "$TAG" "$VERSION_NAME" "$RUNNER_TEMP/commits.txt" > "$RUNNER_TEMP/release.md"
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release.md"
